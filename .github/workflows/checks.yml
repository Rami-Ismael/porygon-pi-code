name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # Same Ruff version as .pre-commit-config.yaml; catches commits made with --no-verify.
      - run: uvx ruff@0.14.1 check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt
      - name: Point the local staging paths at this checkout
        # The code reads /tmp/vgc-pilot/{data,src}, the laptop's staging folder.
        run: |
          mkdir -p /tmp/vgc-pilot
          ln -s "$GITHUB_WORKSPACE/data" /tmp/vgc-pilot/data
          ln -s "$GITHUB_WORKSPACE/src" /tmp/vgc-pilot/src
      - name: Run the tests that need no local data
        run: .venv/bin/python scripts/ci_tests.py
