</style></head><body><main id="stage"></main><div class="sr-only" role="status" aria-live="polite" id="announcement"></div><script>
'use strict';
const DATA=@@DATA@@;
const names={stats:'Stat Points',item:'Items',move:'Moves',pokemon:'Whole Pokémon',ability:'Abilities',alignment:'Stat Alignment',mixed:'Mixed parts'};
const sizes=Object.fromEntries(Object.keys(names).map(task=>[task,[...new Set(DATA.trials.filter(t=>t.task===task).map(t=>t.k))].sort((a,b)=>a-b)]));
const fields=[['evs','Points'],['item','Item'],['moves',0],['moves',1],['moves',2],['moves',3],['ability','Ability'],['nature','Alignment']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>(100*n).toFixed(0)+'%';
const trial=id=>DATA.trials.find(t=>t.id===id)||DATA.trials[0];
const base=t=>DATA.starts[t.start];
const statText=s=>Object.entries(s).filter(([k,v])=>v).map(([k,v])=>`${v} ${k}`).join(' / ')||'0 points';
const get=(o,p)=>p.reduce((v,k)=>v?.[k],o);
const isMasked=(t,p)=>t.paths.some(q=>q.every((k,i)=>p[i]===k));
const logo='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h8l-3 7 10 7H9L4 12Z" fill="currentColor"/><path d="m12 5 8 7-1 7-10-7Z" fill="none" stroke="currentColor"/></svg>';

function taskSelect(task,action='scan-task'){return `<label class="select-label">Mask family<select class="select" data-action="${action}">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${task===k?'selected':''}>${v}</option>`).join('')}</select></label>`}
function scanTrial(){return trial(`s${state.scanTeam}-${state.scanTask}-${sizes[state.scanTask][state.scanK]}`)}
let state={scanTask:'item',scanTeam:1,scanK:2,reveal:false,scanCell:null,model:'ling',opponent:0,costOpen:false,calls:243,scenario:'observed'};
const stage=document.getElementById('stage');
function mast(){return `<header class="mast"><div class="brand">${logo}Porygon–Pi / Mask lab</div><div class="mast-right">Ling × Diffusion${DATA.diffusion.members?.some(n=>n.endsWith('_regmb_v3'))?' v3':DATA.diffusion.members?.some(n=>n.endsWith('_regmb_v2'))?' v2':''} / M-B</div></header>`}
function footer(){return `<footer class="footnote"><p>Diffusion baseline: ask ${DATA.diffusion.target_win_rate} · guidance ${DATA.diffusion.guidance} · temperature ${DATA.diffusion.temperature}.<br>Recorded pilot · ${DATA.starts.length} ${DATA.starterKind} starts · ${DATA.trials.length} masks · Champions M-B · BC policy on both sides.<br>The slider selects recorded nested masks. Policy seeds match; simulator randomness is not fixed. These results do not establish generalization or a winning model.</p><div class="fine">FROZEN DATA / NO LIVE API CALLS<br>${DATA.trials.length} Ling attempts · ${DATA.diffusion.scored} diffusion panels</div></footer>`}
function viewTrial(){const t=scanTrial();if(state.model==='ling')return t;const d=t.diffusion;return {...t,valid:!!d?.valid,error:!d?.supported?'Unsupported fixed context: '+(d?.missing||[]).map(e=>e.value).filter((v,i,a)=>a.indexOf(v)===i).join(', '):d.error,ling_team:d?.team}}
function overview(){const s=DATA.metrics;return `<div class="overview"><div class="stat-card success"><span class="spark" aria-hidden="true">✦</span><div class="smallcap">Ling legal success</div><div class="metric">${(100*s.legal/s.attempts).toFixed(1)}%</div><div class="fine">${s.legal} / ${s.attempts} completions accepted</div></div><div class="stat-card"><div class="smallcap">Ling vs original team</div><div class="metric">${signed(s.deltaOriginal)} <small>pp</small></div><div class="fine">Paired gain · legal completions only</div></div><div class="stat-card"><div class="smallcap">Ling vs random fill</div><div class="metric">${signed(s.deltaRandom)} <small>pp</small></div><div class="fine">${DATA.starts.length} starts weighted equally · exploratory</div></div><div class="stat-card"><span class="spark" aria-hidden="true">✧</span><div class="smallcap">Recorded Ling API cost</div><div class="metric">$${DATA.cost.total.toFixed(5)}</div><div class="fine">${(100*DATA.cost.total).toFixed(2)} cents for all ${DATA.trials.length} attempts</div></div></div>`}
function signed(v){return (v>=0?'+':'')+v.toFixed(2)}
function score(l){return l?l.wins/l.battles:null}
function evidence(t){const raw=scanTrial(),l=t.labels[state.model],orig=t.labels.original,rnd=t.labels.random;const family=DATA.trials.filter(r=>r.task===t.task),passed=family.filter(r=>r.valid).length;const op=DATA.opponents[state.opponent],outcome=DATA.excludedStarterIds[t.start]===op.team_id?null:l?.results.filter(r=>r[1]===op.team_id).reduce((a,r)=>({w:a.w+r[2],l:a.l+r[3],t:a.t+r[4]}),{w:0,l:0,t:0});const name=state.model==='ling'?'Ling':'Diffusion';return `<div class="analysis-grid"><section class="evidence-panel"><div class="row spread"><span class="smallcap">This mask / team ${String(t.start+1).padStart(2,'0')}</span><span class="tag ${t.valid?'good':'bad'}">${t.valid?'Legal':state.model==='diffusion'&&!raw.diffusion.supported?'Unsupported':'Rejected'}</span></div><h2>Did the fill help?</h2><p class="caption">Same 50-battle schedule · ${DATA.excludedStarterIds.length?48:49} meta opponents · BC vs BC</p><div class="results-stack">${['original','random','ling','diffusion'].map(k=>{const a=t.labels[k];return `<div class="result-line ${k}"><span>${{original:'Untouched team',random:'Random legal fill',ling:'Ling completion',diffusion:'F1 + G2 diffusion'}[k]}</span><strong>${a?pct(score(a)):k==='diffusion'&&!raw.diffusion.supported?'Unsupported':'Rejected'}</strong>${a?`<div class="track"><i style="--score:${score(a)}"></i></div>`:''}</div>`}).join('')}</div><div class="delta-row"><div><span class="smallcap">${name} vs original</span><strong style="color:${l&&score(l)<score(orig)?'var(--them)':'var(--you)'}">${l?signed(100*(score(l)-score(orig)))+' pp':'Not scored'}</strong></div><div><span class="smallcap">${name} vs random</span><strong style="color:${l&&score(l)<score(rnd)?'var(--them)':'var(--you)'}">${l?signed(100*(score(l)-score(rnd)))+' pp':'Not scored'}</strong></div></div>${!t.valid?`<p class="status-note">${esc(t.error)}. No battle result is invented.</p>`:''}<p class="caption" style="margin-top:13px">Ling passed ${passed} / ${family.length} ${names[t.task].toLowerCase()} tasks. One panel is noisy; gain is not proof.</p></section><section class="evidence-panel"><div class="row spread"><span class="smallcap">The threat constellation</span><span class="selected-tag">${name} / ${l?l.wins+' wins':'not scored'}</span></div><h2>Every sparkle is a result.</h2><p class="caption">✦ At least one observed win · · no win · – not scored</p><div class="stars" aria-label="Opponent results">${DATA.opponents.map((o,i)=>{const excluded=DATA.excludedStarterIds[t.start]===o.team_id;const wins=excluded?undefined:l?.results.filter(r=>r[1]===o.team_id).reduce((s,r)=>s+r[2],0);return `<button class="star ${wins?'won':''}" data-action="opponent" data-value="${i}" aria-pressed="${state.opponent===i}" aria-label="Opponent ${i+1}: ${DATA.excludedStarterIds[t.start]===o.team_id?'excluded starter':!l?'not scored':wins?'at least one win':'no wins'}">${excluded||!l?'–':wins?'✦':'·'}</button>`}).join('')}</div><div class="threat-inspect" aria-live="polite"><strong>Opponent ${String(state.opponent+1).padStart(2,'0')} · ${outcome?outcome.w+'W / '+outcome.l+'L / '+outcome.t+'T':'not scored'}</strong>${esc(op.paste.split(/\n\s*\n/).map(s=>s.split('\n')[0].split(' @ ')[0]).join(' · '))}</div><div class="coverage-note">Diffusion: ${DATA.diffusion.legal} legal / ${DATA.trials.length} tasks; ${DATA.diffusion.supported} / ${DATA.trials.length} contexts supported. ${DATA.diffusion.pairs.length} tasks have scores for both models. ${DATA.starts.length===3?'Three starting teams are too few to establish an overall winner.':'These in-pool results do not establish held-out generalization.'}</div></section></div>`}
function costPanel(){const c=DATA.cost,rate=c[state.scenario],value=rate*state.calls;return `<details class="cost-panel" ${state.costOpen?'open':''}><summary><span>Cost notebook <span class="muted">/ measured usage, corrected forecast</span></span><strong>$${c.total.toFixed(5)} <span aria-hidden="true">↗</span></strong></summary><div class="cost-body"><div><span class="smallcap">What the recorded calls cost</span><p><strong>${(c.cachedFraction*100).toFixed(1)}% input cache hits</strong>, short replies and reasoning disabled. Each call averaged ${Math.round(c.meanInput).toLocaleString()} input tokens and ${Math.round(c.meanOutput)} output tokens. Invalid outputs still cost money.</p><p>Recorded effective rates per million tokens: $0.021 input / $0.0042 cached input / $0.0616 output. These are historical rates inferred from the receipts, not a current price quote.</p><p>Setup smoke: $${c.smoke.toFixed(5)} extra. Both recorded runs: $${(c.total+c.smoke).toFixed(5)}. Local compute excluded.</p></div><div><div class="cost-controls"><label class="select-label">Planned calls<select class="select" data-action="calls">${[63,243,306,1000,8100,14100].map(n=>`<option value="${n}" ${state.calls===n?'selected':''}>${n.toLocaleString()}${n===14100?' · full 7-task grid':''}</option>`).join('')}</select></label><label class="select-label">Usage scenario<select class="select" data-action="scenario">${[['observed','Observed cache + output'],['cold','No cache · same output'],['maxOutput','No cache · 4,096 output']].map(([k,n])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="estimate">$${value.toFixed(state.calls===63?5:2)}</div><p>Projection only. Assumes the same mean prompt length and effective rates. Larger masks, retries and price changes need a new calculation. No run starts here.</p></div></div></details>`}
function xray(){const t=viewTrial(),team=state.reveal&&t.valid?t.ling_team:base(t);let selected=state.scanCell;const focus=selected?fields[selected[1]]:null;const val=selected?get(team,[selected[0],...focus.slice(0,1),...(typeof focus[1]==='number'?[focus[1]]:[])]):null;return `<section class="view xray"><div class="wrap">${mast()}<div class="hero"><div><span class="eyebrow">Masked completion / experiment 001</span><h1>See what changes.<br><span>Measure what helps.</span></h1></div><p class="lede">${DATA.starterKind==='frozen meta pool'?'Frozen meta teams.':'Random legal teams.'} One precise mask. Ling and F1 + G2 diffusion fill the gaps; the same behaviour-cloning policy plays every battle.</p></div>${overview()}<div class="toolbar">${taskSelect(state.scanTask)}<label class="select-label">Starting team<select class="select" data-action="scan-team">${DATA.starts.map((_,i)=>`<option value="${i}" ${i===state.scanTeam?'selected':''}>Team ${String(i+1).padStart(2,'0')}</option>`).join('')}</select></label><div class="range-control"><label for="mask-range"><span>Mask size</span><strong>k = ${t.k}</strong></label><input id="mask-range" type="range" min="0" max="${sizes[state.scanTask].length-1}" step="1" value="${state.scanK}" data-action="scan-k" aria-label="Mask size: ${t.k} parts"></div><div class="segmented model-switch" aria-label="Completion model">${['ling','diffusion'].map(k=>`<button data-action="model" data-value="${k}" aria-pressed="${state.model===k}">${k==='ling'?'Ling':'Diffusion'}</button>`).join('')}</div><button class="btn secondary" data-action="scan-reveal">${state.reveal?'Restore mask':'Inspect fill'} <span aria-hidden="true">↗</span></button></div><div class="scan-shell"><div class="scan-grid"><div class="scan-heading">POKÉMON / SLOT</div>${fields.map(([f,v])=>`<div class="scan-heading">${typeof v==='number'?'MOVE '+(v+1):v.toUpperCase()}</div>`).join('')}${team.map((s,i)=>`<div class="scan-species ${t.task==='pokemon'&&isMasked(t,[i])&&state.reveal&&t.valid?'filled-species':''}"><span class="fill-value">${t.task==='pokemon'&&isMasked(t,[i])&&!state.reveal?'Unknown Pokémon':esc(s.species)}</span></div>${fields.map(([f,v],j)=>{const path=[i,f,...(typeof v==='number'?[v]:[])],ism=isMasked(t,path),raw=get(team,path);return `<button class="scan-cell ${ism?'mask':''} ${ism&&state.reveal&&t.valid?'revealed':''}" data-action="scan-cell" data-value="${i},${j}" aria-label="${esc(s.species)} ${typeof v==='number'?'move '+(v+1):v}, ${ism?'masked':'fixed'}"><span class="fill-value">${esc(f==='evs'?Object.values(raw).join('·'):raw)}</span>${ism?'<span class="veil" aria-hidden="true">⌁</span>':''}</button>`}).join('')}`).join('')}</div><div class="scan-bottom"><div class="scan-legend"><span><i class="mint"></i>Masked / may change</span><span><i></i>Fixed / must not change</span></div><span class="fine">${t.task==='pokemon'?t.k+' whole rows':t.k+' fields'} unlocked · click a cell to inspect</span></div><div class="scan-details" aria-live="polite">${state.reveal&&!t.valid?`<span style="color:var(--them)">Rejected: ${esc(t.error)} No accepted fill is available; the mask remains closed.</span>`:selected?`<strong>${esc(team[selected[0]].species)}</strong> / ${typeof focus[1]==='number'?'Move '+(focus[1]+1):focus[1]}: ${state.reveal||!isMasked(t,[selected[0],focus[0],...(typeof focus[1]==='number'?[focus[1]]:[])])?esc(typeof val==='object'?statText(val):val):'Hidden from the completion model. This is a masked field.'}`:'Inspect a cell to distinguish a model edit from a value that was fixed all along.'}</div></div>${evidence(t)}${costPanel()}${footer()}</div></section>`}
function animateAcceptedFill(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timing={duration:reduced?100:180,easing:getComputedStyle(stage.querySelector('.xray')).getPropertyValue('--ease').trim()};
  stage.querySelectorAll('.scan-cell.revealed .fill-value,.filled-species .fill-value').forEach(el=>{
    el.animate(reduced?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(12%) scale(0.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],timing);
  });
  stage.querySelectorAll('.scan-cell.revealed .veil').forEach(el=>{
    el.animate(reduced?[{opacity:1},{opacity:0}]:[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-8px)'}],timing);
  });
}
function paint(){const el=document.activeElement,a=el?.dataset.action,v=el?.dataset.value;stage.innerHTML=xray();if(a)[...stage.querySelectorAll('[data-action]')].find(n=>n.dataset.action===a&&(v===undefined||v===n.dataset.value))?.focus({preventScroll:true})}
function act(action,value,animate=false){switch(action){case 'scan-task':state.scanTask=value;state.scanK=Math.min(state.scanK,sizes[value].length-1);state.reveal=false;state.scanCell=null;break;case 'scan-team':state.scanTeam=Number(value);state.reveal=false;state.scanCell=null;break;case 'scan-k':state.scanK=Number(value);state.reveal=false;state.scanCell=null;break;case 'scan-reveal':state.reveal=!state.reveal;break;case 'scan-cell':state.scanCell=value.split(',').map(Number);break;case 'model':state.model=value;state.reveal=!!viewTrial().valid;state.scanCell=null;break;case 'opponent':state.opponent=Number(value);break;case 'calls':state.calls=Number(value);break;case 'scenario':state.scenario=value;break;default:return}paint();if(animate&&state.reveal&&viewTrial().valid&&(action==='model'||action==='scan-reveal'))animateAcceptedFill();if(action==='model')document.getElementById('announcement').textContent=`${state.model==='ling'?'Ling':'Diffusion'}: ${viewTrial().valid?'accepted answer filled the masked fields.':'no accepted answer; fields remain masked.'}`;}
stage.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)act(b.dataset.action,b.dataset.value,e.detail>0)});
stage.addEventListener('change',e=>{if(e.target.matches('select[data-action],input[type=range]'))act(e.target.dataset.action,e.target.value)});
stage.addEventListener('input',e=>{if(e.target.matches('#mask-range')){const k=sizes[state.scanTask][Number(e.target.value)];stage.querySelector('label[for="mask-range"] strong').textContent=`k = ${k}`;e.target.setAttribute('aria-label',`Mask size: ${k} parts`);}});
stage.addEventListener('toggle',e=>{if(e.target.matches('.cost-panel'))state.costOpen=e.target.open},true);
paint();
</script></body></html>
